        :root {

            --white: #ffffff;
            --shadow-dark: #a3b1c6;
            --shadow-light: #ffffff;

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            transition: 0.5s; 
            overflow-x: hidden; 
            scroll-behavior: smooth;

        /* Neumorphic Card */
        .neu-card {
            background: var(--bg);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Neumorphic Input & Select */
        .neu-input {
            width: 100%;
            padding: 16px;
            border: none;
            outline: none;
            background: var(--bg);
            border-radius: 18px;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            color: var(--text);
            box-sizing: border-box;
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 15px;
            font-family: inherit;
            transition: 0.3s;
        }
        
        .neu-input:focus {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            border-left: 5px solid var(--primary);
        }

        .error-shake { animation: shake 0.4s ease-in-out; border: 1px solid var(--danger); }

        select.neu-input { cursor: pointer; }
        optgroup { font-weight: 800; color: var(--primary); background: #fff; }

        /* Neumorphic Button */
        .neu-btn {
            width: 100%;
            padding: 18px;
            margin-top: 15px;
            border: none;
            border-radius: 18px;
            background: var(--bg);
            color: var(--primary);
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: 0.3s ease;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

        .neu-btn:hover { color: #008f6f; transform: translateY(-2px); }

            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);

        }
        .neu-btn:disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

        .btn-danger { color: var(--danger); }
        .btn-danger:hover { color: #c0392b; }

        /* Layout Parts */
        .header { 
            padding: 20px 25px; display: flex; justify-content: space-between; align-items: center;

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 1001; backdrop-filter: blur(3px); }
        .overlay.active { display: block; }

        .container { max-width: 850px; margin: 30px auto; padding: 0 20px 100px; }
        label { display: block; margin: 20px 0 10px 12px; font-weight: 800; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; }

        /* Output Box - Typewriter Cursor */

        }

        .scan-container { 
            position: relative; width: 100%; border-radius: 20px; overflow: hidden; margin-top: 20px;

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* Notifications */
        #toast { 
            visibility: hidden; min-width: 250px; background: var(--primary); color: #fff; 
            text-align: center; border-radius: 50px; padding: 15px; position: fixed; 
            left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 10000; box-shadow: 0 10px 20px rgba(0,0,0,0.2);

        #toast.show { visibility: visible; animation: fadeInUp 0.5s; }
        @keyframes fadeInUp { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }

        .creator-highlight { color: var(--primary); font-size: 1rem; letter-spacing: 2px; }
    </style>

            localStorage.setItem('ma_link', document.getElementById('targetLink').value);
            localStorage.setItem('ma_post', document.getElementById('postLink').value);
        }

        function loadData() {
            if(localStorage.getItem('ma_name')) document.getElementById('targetName').value = localStorage.getItem('ma_name');
            if(localStorage.getItem('ma_link')) document.getElementById('targetLink').value = localStorage.getItem('ma_link');
            if(localStorage.getItem('ma_post')) document.getElementById('postLink').value = localStorage.getItem('ma_post');
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2500);
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('active'); 
            document.getElementById('overlay').classList.toggle('active'); 
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(t).style.display = 'block';
            if(window.innerWidth < 768 && document.getElementById('sidebar').classList.contains('active')) {
                toggleSidebar();
            }
        }

        function triggerShake(id) {
            const el = document.getElementById(id);
            el.classList.add('error-shake');
            setTimeout(() => el.classList.remove('error-shake'), 400);
            el.focus();
        }

        // --- NEW: TYPEWRITER EFFECT ---
        function typeWriter(text, elementId, speed = 10) {
            const el = document.getElementById(elementId);
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    typewriterTimeout = setTimeout(type, speed);
                }
            }
            type();
        }

        function generateGodV14() {
            const nameInp = document.getElementById('targetName');
            const linkInp = document.getElementById('targetLink');
            const post = document.getElementById('postLink').value;
            const cat = document.getElementById('category').value;
            const btn = document.getElementById('execBtn');

            if(!nameInp.value) { 
                showToast("Error: Target Name Missing!"); 
                triggerShake('targetName');
                return; 
            }
            if(!linkInp.value || !linkInp.value.toLowerCase().includes('whatsapp')) { 
                showToast("Error: Valid WhatsApp Link Required!"); 
                triggerShake('targetLink');
                return; 
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-cog fa-spin"></i> Processing...';
            document.getElementById('resultBox').style.display = "none";
            document.getElementById('actionArea').style.display = "none";

            setTimeout(() => {
                const refID = "MA-INF-" + Math.floor(1000 + Math.random() * 9000);
                const res = `OFFICIAL INFINITY COMPLIANCE REPORT\n---------------------------------------\nREF ID: ${refID}\nTARGET CHANNEL: ${nameInp.value}\nCHANNEL URL: ${linkInp.value}\nEVIDENCE: ${post || "Attached Media Evidence"}\n\nVIOLATION DESCRIPTION:\n${reportsData[cat]}\n\nREQUIRED ACTION: Permanent Termination of Access.`;
                
                const box = document.getElementById('resultBox');
                box.style.display = "block";
                
                // Using new typewriter effect
                clearTimeout(typewriterTimeout);
                typeWriter(res, 'resultBox', 5);

                document.getElementById('actionArea').style.display = "grid";
                box.scrollIntoView({ behavior: 'smooth', block: 'center' });
                showToast("God Command Generated!");

                btn.disabled = false;
                btn.innerHTML = 'Execute God Command <i class="fas fa-bolt"></i>';
            }, 800);
        }

        function resetFields() {
            document.getElementById('targetName').value = "";
            document.getElementById('targetLink').value = "";
            document.getElementById('postLink').value = "";
            localStorage.clear(); // Clear storage
            document.getElementById('resultBox').style.display = "none";
            document.getElementById('actionArea').style.display = "none";
            document.getElementById('category').selectedIndex = 0;
            showToast("System Reset Successful!");
        }

        function previewImg(event) {
            const file = event.target.files[0];
            if(file) {
                document.getElementById('prevImg').src = URL.createObjectURL(file);
                document.getElementById('imgPrevCont').style.display = "block";
                document.getElementById('scanCont').style.display = "block";
            }
        }

        function analyzeAIV14() {
            const text = document.getElementById('aiInput').value.toLowerCase();
            const img = document.getElementById('aiImage');
            const btn = document.getElementById('aiBtn');
            
            if(!text && !img.files[0]) { 
                showToast("Provide Evidence First!"); 
                triggerShake('aiInput');
                return; 
            }
            
            if(btn.disabled) return;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-atom fa-spin"></i> Analyzing Evidence...';
            
            setTimeout(() => {
                const smartReasons =[
                    "Neural scan found high-probability digital manipulation in the screenshot artifacts.",
                    "Visual signatures match known unverified financial recruitment scam patterns.",
                    "Detected hidden phishing links and malicious redirect anchors in the shared media.",
                    "Contextual pattern analysis confirms trust exploitation tactics used by the admin.",
                    "Advanced pixel-depth analysis suggests the provided proof is fabricated/modified.",
                    "Deceptive engagement triggers detected: Content designed to mislead community trust.",
                    "Evidence confirms the promotion of unauthorized or illegal external digital services."
                ];

                let catName = "Overall Policy Violation";
                detectedValue = "overall";
                
                if(text.match(/money|earn|invest|binance|crypto|profit/)) {
                    catName = "Financial Scam / Fraud"; detectedValue = "short_6";
                } else if(text.match(/hack|script|mod|cheat/)) {
                    catName = "Illegal Tools / Hacking"; detectedValue = "illegal_old";
                } else if(text.match(/porn|sex|adult|nude/)) {
                    catName = "Explicit Media Content"; detectedValue = "explicit";
                } else {
                    const randomCats =["short_1", "short_5", "short_13", "scam", "spam"];
                    detectedValue = randomCats[Math.floor(Math.random() * randomCats.length)];
                    catName = "Detected Community Risk";
                }

                const finalReason = smartReasons[Math.floor(Math.random() * smartReasons.length)];

                document.getElementById('resCat').innerText = "AI RESULT: " + catName;
                document.getElementById('resReason').innerText = "AI Logic: " + finalReason;
                const outputDiv = document.getElementById('aiOutput');
                outputDiv.style.display = "block";
                outputDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });

                btn.innerHTML = 'Run Infinity Scan <i class="fas fa-atom"></i>';
                btn.disabled = false;
                showToast("Deep Neural Analysis Complete!");
            }, 2500);
        }

        document.getElementById('applyAIBtn').onclick = function() {
            document.getElementById('category').value = detectedValue;
            switchTab('bot');
            showToast("AI Category Applied!");
        };

        function copyText() {
            const t = document.getElementById('resultBox').innerText;
            navigator.clipboard.writeText(t);
            showToast("Report Copied!");
        }

        // --- NEW: DIRECT WHATSAPP SHARE ---
        function directShare() {
            const text = document.getElementById('resultBox').innerText;
            // Format text nicely (Bold headers if needed, but simple is safer for URL)
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        function sendMail() {
            const body = document.getElementById('resultBox').innerText;
            window.location.href = `mailto:support@whatsapp.com?subject=Policy Violation Report&body=${encodeURIComponent(body)}`;
        }
    </script>
